OGLE DRIVE</text><text x="177.5" y="588" font-size="17" fill="#596762" font-weight="400" text-anchor="middle">Detect uploaded content</text><path d="M312 565H365" fill="none" stroke="#6d8432" stroke-width="3" marker-end="url(#arrow)"/><rect x="383" y="526" width="244" height="90" rx="10" fill="#e1e5db" stroke="none"/><rect x="378" y="520" width="244" height="90" rx="10" fill="#ffffff" stroke="#d3d9cf"/><text x="500" y="559" font-size="23" fill="#1d2927" font-weight="650" text-anchor="middle">ASANA</text><text x="500" y="588" font-size="17" fill="#596762" font-weight="400" text-anchor="middle">Create team tasks</text><path d="M630 565H683" fill="none" stroke="#6d8432" stroke-width="3" marker-end="url(#arrow)"/><rect x="701" y="526" width="254" height="90" rx="10" fill="#e1e5db" stroke="none"/><rect x="696" y="520" width="254" height="90" rx="10" fill="#ffffff" stroke="#d3d9cf"/><text x="823" y="559" font-size="23" fill="#1d2927" font-weight="650" text-anchor="middle">TEAM HANDOFF</text><text x="823" y="588" font-size="17" fill="#596762" font-weight="400" text-anchor="middle">Approval → delivery</text><text x="50" y="682" font-size="21" fill="#596762" font-weight="400" >The repository contains the demo page + video.</text><path d="M48 729L952 729" fill="none" stroke="#d3d9cf" stroke-width="2" /><text x="48" y="764" font-size="18" fill="#596762" font-weight="400" >TELEGRAM / MAKE.COM / DRIVE / ASANA</text><text x="952" y="764" font-size="17" fill="#526b14" font-weight="600" text-anchor="end">WATCH THE WORKFLOW · OPEN REPO ↗</text></svg>