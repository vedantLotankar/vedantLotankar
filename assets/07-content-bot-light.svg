<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="805" viewBox="0 0 1000 805" role="img" aria-labelledby="title desc"><title id="title">07-content-bot</title><desc id="desc">Telegram Content Bot, pair-built with Rishi in Make.com. Brief, approval, revision, Drive upload detection and Asana task workflow. Repository contains the demo page and video.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6d8432" stroke-width="1.6"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d3d9cf"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif} .flow{stroke-dasharray:9 9;animation:travel 2s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-36}}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes scan{50%{opacity:.15}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="1000" height="805" rx="0" fill="#f5f5ef" stroke="none"/><rect x="20" y="20" width="960" height="765" rx="0" fill="url(#grid)" stroke="none"/><text x="48" y="65" font-size="18" fill="#526b14" font-weight="700" letter-spacing="2">06</text><text x="102" y="65" font-size="18" fill="#596762" font-weight="400" letter-spacing="2">TEAM WORKFLOW AUTOMATION</text><text x="48" y="133" font-size="49" fill="#1d2927" font-weight="750" letter-spacing="-2">Brief. Review. Revise. Ship.</text><text x="50" y="174" font-size="22" fill="#596762" font-weight="400" >Telegram Content Bot</text><rect x="48" y="199" width="298" height="32" rx="16" fill="#e6eadf" stroke="none"/><text x="62" y="221" font-size="16" fill="#1d2927" font-weight="600" >PAIR BUILT / VEDANT + RISHI</text><rect x="55" y="