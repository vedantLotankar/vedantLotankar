<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Vedant Lotankar's Debug Arcade</title><desc id="desc">A kinetic workshop: a marble travels through a phone, a diagnostic machine and an arcade cabinet. Explore the projects below.</desc>
<style>
text{font-family:Consolas,'Courier New',monospace;fill:#22312f}.small{font-size:15px;fill:#52635b}.label{font-size:12px;letter-spacing:2px;fill:#52635b}.wire{fill:none;stroke:#547446;stroke-width:3;stroke-dasharray:5 8}.pulse{animation:pulse 3s ease-in-out infinite}.gear{transform-origin:603px 340px;animation:spin 18s linear infinite}.steam{animation:rise 4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{50%{transform:translateY(-9px);opacity:.4}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}animateMotion{display:none}}
</style>
<rect width="1200" height="560" rx="22" fill="#f4efdf"/>
<rect x="24" y="24" width="1152" height="512" rx="12" fill="none" stroke="#52635b" opacity=".3"/>
