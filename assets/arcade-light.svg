<circle cx="1125" cy="63" r="7" fill="#547446" class="pulse"/>
<text x="56" y="137" font-size="54" font-weight="bold" letter-spacing="-3">Vedant Lotankar</text>
<text x="58" y="175" class="small">Apps, automation, and experiments you can open up.</text>
