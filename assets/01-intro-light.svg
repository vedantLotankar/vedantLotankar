<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">01-intro</title><desc id="desc">Vedant Lotankar. A visual atlas of apps, automation and machine-learning experiments. Five pair-built projects with Rishi Sangare and original solo builds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6d8432" stroke-width="1.6"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d3d9cf"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif} .flow{stroke-dasharray:9 9;animation:travel 2s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-36}}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes scan{50%{opacity:.15}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="1000" height="740" rx="0" fill="#f5f5ef" stroke="none"/><rect x="20" y="20" width="960" height="700" rx="0" fill="url(#grid)" stroke="none"/><text x="48" y="65" font-size="18" fill="#526b14" font-weight="700" letter-spacing="2">VL</text><text x="102" y="65" font-size="18" fill="#596762" font-weight="400" letter-spacing="2">BUILD ATLAS / VOL. 01</text><text x="45" y="180" font-size="112" fill="#1d2927" font-weight="800" letter-spacing="-7">VEDANT</text><text x="45" y="282" font-size="112" fill="#1d2927" font-weight="800" letter-spacing="-7">LOTANKAR</text><rect x="50" y="313" width="630" height="58" rx="0" fill="#d4f654" stroke="none"/><text x="68" y="351" font-size="27" fill="#202c15" font-weight="700" >APPS. AUTOMATION. EXPERIMENTS.</text><text x="51" y="421" font-size="36" fill="#1d2927" font-weight="650" >Follow the signal.</text><text x="52" y="459" font-size="23" fill="#596762" font-weight="400" >Open a diagram. Explore the build.</text><rect x="50" y="505" width="228" height="32" rx="16" fill="#e6eadf" stroke="none"/><text x="64" y="527" font-size="16" fill="#1d2927" font-weight="600" >ORIGINAL SOLO BUILDS</text><rect x="50" y="548" width="348" height="32" rx="16" fill="#e6eadf" stroke="none"/><text x="64" y="570" font-size="16" fill="#1d2927" font-weight="600" >5 PAIR-BUILT PROJECTS WITH RISHI</text><g transform="translate(665 355)"><ellipse cx="110" cy="150" rx="70" ry="26" fill="none" stroke="#d3d9cf" transform="rotate(-30 110 150)"/><ellipse cx="110" cy="150" rx="93" ry="41" fill="none" stroke="#d3d9cf" transform="rotate(-30 110 150)"/><ellipse cx="110" cy="150" rx="116" ry="56" fill="none" stroke="#d3d9cf" transform="rotate(-30 110 150)"/><ellipse cx="110" cy="150" rx="139" ry="71" fill="none" stroke="#d3d9cf" transform="rotate(-30 110 150)"/><path d="M4 210L110 150L211 97" fill="none" stroke="#6d8432" stroke-width="3" class="flow"/><path d="M33 99L110 150L190 227" fill="none" stroke="#387c96" stroke-width="3" class="flow"/><path d="M110 75L177 114V186L110 225L43 186V114Z" fill="#ffffff" stroke="#1d2927" stroke-width="2"/><path d="M110 75V150L177 114M110 150L43 114M110 150V225" stroke="#1d2927" stroke-width="2" fill="none"/><circle cx="110" cy="150" r="15" fill="#d4f654" class="pulse"/><circle cx="4" cy="210" r="9" fill="#387c96" /><circle cx="211" cy="97" r="9" fill="#d4f654" /><circle cx="33" cy="99" r="9" fill="#d4f654" /><circle cx="190" cy="227" r="9" fill="#387c96" /></g><path d="M50 652L950 652" fill="none" stroke="#d3d9cf" stroke-width="2" /><text x="50" y="698" font-size="17" fill="#596762" font-weight="600" letter-spacing="3">SCROLL TO TRACE THE WORK</text><text x="949" y="701" font-size="40" fill="#d4f654" font-weight="600" text-anchor="end">↓</text></svg>