<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="382" viewBox="0 0 1000 382" role="img" aria-labelledby="title desc"><title id="title">answer-2</title><desc id="desc">answer-2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6d8432" stroke-width="1.6"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d3d9cf"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif} .flow{stroke-dasharray:9 9;animation:travel 2s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-36}}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes scan{50%{opacity:.15}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="1000" height="382" rx="0" fill="#f5f5ef" stroke="none"/><rect x="20" y="20" width="960" height="342" rx="0" fill="url(#grid)" stroke="none"/><text x="48" y="65" font-size="18" fill="#526b14" font-weight="700" letter-spacing="2">↳</text><text x="102" y="65" font-size="18" fill="#596762" font-weight="400" letter-spacing="2">DIAGNOSIS TRACE</text><text x="48" y="133" font-size="49" fill="#1d2927" font-weight="750" letter-spacing="-2">A longer wait hides the symptom.</text><text x="50" y="174" font-size="22" fill="#596762" font-weight="400" >The missing voice still needs fixing.</text><rect x="55" y="242" width="254" height="95" rx="10" fill="#e1e5db" stroke="none"/><rect x="50" y="236" width="254" height="95" rx="10" fill="#ffffff" stroke="#d3d9cf"/><text x="177" y="277.5" font-size="23" fill="#1d2927" font-weight="650" text-anchor="middle">MORE TIME</text><text x="177" y="306.5" font-size="17" fill="#596762" font-weight="400" text-anchor="middle">Same voice ID</text><path d="M312 283H364" fill="none" stroke="#6d8432" stroke-width="3" marker-end="url(#arrow)"/><rect x="382" y="242" width="247" height="95" rx="10" fill="#e1e5db" stroke="none"/><rect x="377" y="236" width="247" height="95" rx="10" fill="#ffffff" stroke="#d3d9cf"/><text x="500.5" y="277.5" font-size="23" fill="#1d2927" font-weight="650" text-anchor="middle">NO PLAYBACK</text><text x="500.5" y="306.5" font-size="17" fill="#596762" font-weight="400" text-anchor="middle">Still silent</text><path d="M633 283H684" fill="none" stroke="#6d8432" stroke-width="3" marker-end="url(#arrow)"/><rect x="702" y="242" width="254" height="95" rx="10" fill="#e1e5db" stroke="none"/><rect x="697" y="236" width="254" height="95" rx="10" fill="#d4f654" stroke="#d3d9cf"/><text x="824" y="277.5" font-size="23" fill="#202c15" font-weight="650" text-anchor="middle">CHECK TTS</text><text x="824" y="306.5" font-size="17" fill="#202c15" font-weight="400" text-anchor="middle">Return to the cause</text></svg>