="2">INTERFACE SCHEMATIC</text><rect x="63" y="314" width="266" height="398" rx="34" fill="#0a110e" stroke="none"/><rect x="55" y="304" width="266" height="398" rx="34" fill="#edf2e7" stroke="none"/><rect x="65" y="316" width="246" height="374" rx="25" fill="#141d1b" stroke="none"/><rect x="152" y="312" width="72" height="17" rx="9" fill="#edf2e7" stroke="none"/><rect x="379" y="314" width="266" height="398" rx="34" fill="#0a110e" stroke="none"/><rect x="371" y="304" width="266" height="398" rx="34" fill="#edf2e7" stroke="none"/><rect x="381" y="316" width="246" height="374" rx="25" fill="#141d1b" stroke="none"/><rect x="468" y="312" width="72" height="17" rx="9" fill="#edf2e7" stroke="none"/><text x="83" y="365" font-size="28" fill="#edf2e7" font-weight="700" >ChefMate</text><rect x="81" y="388" width="214" height="34" rx="12" fill="#1d2c25" stroke="#34483e"/><text x="96" y="410" font-size="15" fill="#a6b8ad" font-weight="400" >Find a recipe…</text><rect x="81" y="439" width="214" height="112" rx="15" fill="#76c7df" stroke="none"/><circle cx="188" cy="493" r="36" fill="#1d2c25" /><circle cx="188" cy="493" r="26" fill="#d4f654" /><path d="M177 478Q199 486 180 507" fill="none" stroke="#202c15" stroke-width="3" /><text x="83" y="583" font-size="17" fill="#edf2e7" font-weight="700" >RECIPE DISCOVERY</text><text x="83" y="614" font-size="17" fill="#a6b8ad" font-weight="400" >Ingredients → steps</text><rect x="83" y="641" width="198" height="32" rx="16" fill="#2d4133" stroke="none"/><text x="97" y="663" font-size="16" fill="#edf2e7" font-weight="600" >DUMMY RECIPE DATA</text><text x="398" y="365" font-size="27" fill="#edf2e7" font-weight="700" >Cooking chat</text><rect x="397" y="398" width="202" height="64" rx="14" fill="#1d2c25" stroke="none"/><text x="412" y="424" font-size="19" fill="#edf2e7" font-weight="600" >Recipe context</text><text x="412" y="449" font-size="17" fill="#a6b8ad" font-weight="400" >+ your question</text><rect x="417" y="480" width="193" height="10