<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="961" viewBox="0 0 1000 961" role="img" aria-labelledby="title desc"><title id="title">03-call-lab</title><desc id="desc">Call Lab for Bolna, pair-built with Rishi. A Twilio-protocol caller feeds Bolna and a log analyzer. Five scenarios distinguish silence, TTS, STT, missing media and corrected configuration.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#d4f654" stroke-width="1.6"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#34483e"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif} .flow{stroke-dasharray:9 9;animation:travel 2s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-36}}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes scan{50%{opacity:.15}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="1000" height="961" rx="0" fill="#141d1b" stroke="none"/><rect x="20" y="20" width="960" height="921" rx="0" fill="url(#grid)" stroke="none"/><text x="48" y="65" font-size="18" fill="#d4f654" font-weight="700" letter-spacing="2">02</text><text x="102" y="65" font-size="18" fill="#a6b8ad" font-weight="400" letter-spacing="2">VOICE-AGENT DIAGNOSTICS</text><text x="48" y="133" font-size="49" fill="#edf2e7" font-weight="750" letter-spacing="-2">A dropped call leaves clues.</text><text x="50" y="174" font-size="22" fill="#a6b8ad" font-weight="400" >Call Lab for Bolna</text><rect x="48" y="199" width="298" height="32" rx="16" fill="#2d4133" stroke="none"/><text x="62" y="221" font-size="16" fill="#edf2e7" font-weight="600" >PAIR BUILT / VEDANT + RISHI</text><rect x="55" y="276" width="263" height="100" rx="10" fill="#0a110e" stroke="none"/><rect x="50" y="270" width="263" height="100" rx="10" fill="#1d2c25" stroke="#34483e"/><text x="181.5" y="314" font-size="23" fill="#edf2e7" font-weight="650" text-anchor="middle">FAKE TWILIO</text><text x="181.5" y="343" font-size="17" fill="#a6b8ad" font-weight="400" text-anchor="middle">Media Streams protocol</text><rect x="374" y="276" width="263" height="100" rx="10" fill="#0a110e" stroke="none"/><rect x="369" y="270" width="263" height="100" rx="10" fill="#1d2c25" stroke="#34483e"/><text x="500.5" y="314" font-size="23" fill="#edf2e7" font-weight="650" text-anchor="middle">BOLNA ENGINE</text><text x="500.5" y="343" font-size="17" fill="#a6b8ad" font-weight="400" text-anchor="middle">Real AssistantManager</text><rect x="693" y="276" width="263" height="100" rx="10" fill="#0a110e" stroke="none"/><rect x="688" y="270" width="263" height="100" rx="10" fill="#d4f654" stroke="#34483e"/><text x="819.5" y="314" font-size="23" fill="#202c15" font-weight="650" text-anchor="middle">LOG DOCTOR</text><text x="819.5" y="343" font-size="17" fill="#202c15" font-weight="400" text-anchor="middle">JSONL + caller events</text><path d="M318 320H360" fill="none" stroke="#d4f654" stroke-width="3" marker-end="url(#arrow)"/><path d="M638 320H680" fill="none" stroke="#d4f654" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="429" font-size="22" fill="#edf2e7" font-weight="700" >5 SCENARIOS. DIFFERENT FAILURE PATHS.</text><rect x="48" y="462" width="904" height="65" rx="6" fill="#1d2c25" stroke="none"/><text x="67" y="503" font-size="22" fill="#a6b8ad" font-weight="700" >01</text><text x="117" y="490" font-size="21" fill="#edf2e7" font-weight="600" >Caller pauses</text><text x="117" y="512" font-size="15" fill="#a6b8ad" font-weight="400" >inactivity_timeout</text><text x="927" y="502" font-size="17" fill="#76c7df" font-weight="700" text-anchor="end">SILENCE</text><rect x="48" y="539" width="904" height="65" rx="6" fill="#1d2c25" stroke="none"/><text x="67" y="580" font-size="22" fill="#a6b8ad" font-weight="700" >02</text><text x="117" y="567" font-size="21" fill="#edf2e7" font-weight="600" >Voice never plays</text><text x="117" y="589" font-size="15" fill="#a6b8ad" font-weight="400" >inactivity_timeout</text><text x="927" y="579" font-size="17" fill="#76c7df" font-weight="700" text-anchor="end">TTS CONFIG</text><rect x="48" y="616" width="904" height="65" rx="6" fill="#1d2c25" stroke="none"/><text x="67" y="657" font-size="22" fill="#a6b8ad" font-weight="700" >03</text><text x="117" y="644" font-size="21" fill="#edf2e7" font-weight="600" >STT returns HTTP 402</text><text x="117" y="666" font-size="15" fill="#a6b8ad" font-weight="400" >transcriber_connection_error</text><text x="927" y="656" font-size="17" fill="#76c7df" font-weight="700" text-anchor="end">STT REJECTED</text><rect x="48" y="693" width="904" height="65" rx="6" fill="#1d2c25" stroke="none"/><text x="67" y="734" font-size="22" fill="#a6b8ad" font-weight="700" >04</text><text x="117" y="721" font-size="21" fill="#edf2e7" font-weight="600" >No inbound media</text><text x="117" y="743" font-size="15" fill="#a6b8ad" font-weight="400" >inactivity_timeout</text><text x="927" y="733" font-size="17" fill="#76c7df" font-weight="700" text-anchor="end">AUDIO FLOW</text><rect x="48" y="770" width="904" height="65" rx="6" fill="#d4f654" stroke="none"/><text x="67" y="811" font-size="22" fill="#202c15" font-weight="700" >05</text><text x="117" y="798" font-size="21" fill="#202c15" font-weight="600" >Corrected configuration</text><text x="117" y="820" font-size="15" fill="#202c15" font-weight="400" >caller hangs up normally</text><text x="927" y="810" font-size="17" fill="#202c15" font-weight="700" text-anchor="end">FIXED</text><path d="M820 374V433H945V447" fill="none" stroke="#d4f654" stroke-width="3" class="flow"/><path d="M48 888L952 888" fill="none" stroke="#34483e" stroke-width="2" /><text x="48" y="923" font-size="18" fill="#a6b8ad" font-weight="400" >PYTHON / WEBSOCKETS / BOLNA</text><text x="952" y="923" font-size="17" fill="#d4f654" font-weight="600" text-anchor="end">FOLLOW THE EVIDENCE · OPEN REPO ↗</text></svg>