<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="961" viewBox="0 0 1000 961" role="img" aria-labelledby="title desc"><title id="title">03-call-lab</title><desc id="desc">Call Lab for Bolna, pair-built with Rishi. A Twilio-protocol caller feeds Bolna and a log analyzer. Five scenarios distinguish silence, TTS, STT, missing media and corrected configuration.</desc><defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#0d1024"/></linearGradient><linearGradient id="active"><stop stop-color="#12394d"/><stop offset="1" stop-color="#28234a"/></linearGradient><radialGradient id="aura"><stop stop-color="#204165" stop-opacity=".45"/><stop offset="1" stop-color="#090d19" stop-opacity="0"/></radialGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#42d5e5" stroke-width="1.6"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#25405a" stroke-width=".65"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}text[letter-spacing]{font-family:Consolas,monospace}.flow{stroke-dasharray:10 12}.pulse{filter:url(#glow)}</style><rect width="1000" height="961" fill="url(#back)"/><rect width="1000" height="961" fill="url(#grid)" opacity=".4"/><ellipse cx="780" cy="200" rx="400" ry="350" fill="url(#aura)"/><g opacity=".38"><path d="M164 691L-1180 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M212 691L-940 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M260 691L-700 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M308 691L-460 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M356 691L-220 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M404 691L20 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M452 691L260 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M500 691L500 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M548 691L740 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M596 691L980 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M644 691L1220 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M692 691L1460 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M740 691L1700 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M788 691L1940 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M836 691L2180 961" fill="none" stroke="#25405a" stroke-width="1" /><path d="M0 691L1000 691" fill="none" stroke="#25405a" stroke-width="1" /><path d="M0 695.21875L1000 695.21875" fill="none" stroke="#25405a" stroke-width="1" /><path d="M0 707.875L1000 707.875" fill="none" stroke="#25405a" stroke-width="1" /><path d="M0 728.96875L1000 728.96875" fill="none" stroke="#25405a" stroke-width="1" /><path d="M0 758.5L1000 758.5" fill="none" stroke="#25405a" stroke-width="1" /><path d="M0 796.46875L1000 796.46875" fill="none" stroke="#25405a" stroke-width="1" /><path d="M0 842.875L1000 842.875" fill="none" stroke="#25405a" stroke-width="1" /><path d="M0 897.71875L1000 897.71875" fill="none" stroke="#25405a" stroke-width="1" /><path d="M0 961L1000 961" fill="none" stroke="#25405a" stroke-width="1" /></g><path d="M20 80V20H80M920 20H980V80M20 881V941H80M920 941H980V881" fill="none" stroke="#42d5e5" stroke-opacity=".6" stroke-width="2"/><text x="48" y="65" font-size="18" fill="#63dce9" font-weight="700" letter-spacing="2">02</text><text x="102" y="65" font-size="18" fill="#a4b9cf" font-weight="400" letter-spacing="2">VOICE-AGENT DIAGNOSTICS</text><text x="48" y="133" font-size="49" fill="#e8f3ff" font-weight="750" letter-spacing="-2">A dropped call leaves clues.</text><text x="50" y="174" font-size="22" fill="#a4b9cf" font-weight="400" >Call Lab for Bolna</text><rect x="48" y="199" width="298" height="32" rx="16" fill="#152b40" stroke="none"/><text x="62" y="221" font-size="16" fill="#e8f3ff" font-weight="600" >PAIR BUILT / VEDANT + RISHI</text><rect x="55" y="276" width="263" height="100" rx="10" fill="#050913" stroke="none"/><rect x="50" y="270" width="263" height="100" rx="10" fill="#101b2d" stroke="#2a405b"/><text x="181.5" y="314" font-size="23" fill="#e8f3ff" font-weight="650" text-anchor="middle">FAKE TWILIO</text><text x="181.5" y="343" font-size="17" fill="#a4b9cf" font-weight="400" text-anchor="middle">Media Streams protocol</text><rect x="374" y="276" width="263" height="100" rx="10" fill="#050913" stroke="none"/><rect x="369" y="270" width="263" height="100" rx="10" fill="#101b2d" stroke="#2a405b"/><text x="500.5" y="314" font-size="23" fill="#e8f3ff" font-weight="650" text-anchor="middle">BOLNA ENGINE</text><text x="500.5" y="343" font-size="17" fill="#a4b9cf" font-weight="400" text-anchor="middle">Real AssistantManager</text><rect x="693" y="276" width="263" height="100" rx="10" fill="#050913" stroke="none"/><rect x="688" y="270" width="263" height="100" rx="10" fill="url(#active)" stroke="#2a405b"/><text x="819.5" y="314" font-size="23" fill="#e8f3ff" font-weight="650" text-anchor="middle">LOG DOCTOR</text><text x="819.5" y="343" font-size="17" fill="#e8f3ff" font-weight="400" text-anchor="middle">JSONL + caller events</text><path d="M318 320H360" fill="none" stroke="#42d5e5" stroke-width="3" marker-end="url(#arrow)"/><path d="M638 320H680" fill="none" stroke="#42d5e5" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="429" font-size="22" fill="#e8f3ff" font-weight="700" >5 SCENARIOS. DIFFERENT FAILURE PATHS.</text><rect x="48" y="462" width="904" height="65" rx="6" fill="#101b2d" stroke="none"/><text x="67" y="503" font-size="22" fill="#a4b9cf" font-weight="700" >01</text><text x="117" y="490" font-size="21" fill="#e8f3ff" font-weight="600" >Caller pauses</text><text x="117" y="512" font-size="15" fill="#a4b9cf" font-weight="400" >inactivity_timeout</text><text x="927" y="502" font-size="17" fill="#c280fa" font-weight="700" text-anchor="end">SILENCE</text><rect x="48" y="539" width="904" height="65" rx="6" fill="#101b2d" stroke="none"/><text x="67" y="580" font-size="22" fill="#a4b9cf" font-weight="700" >02</text><text x="117" y="567" font-size="21" fill="#e8f3ff" font-weight="600" >Voice never plays</text><text x="117" y="589" font-size="15" fill="#a4b9cf" font-weight="400" >inactivity_timeout</text><text x="927" y="579" font-size="17" fill="#c280fa" font-weight="700" text-anchor="end">TTS CONFIG</text><rect x="48" y="616" width="904" height="65" rx="6" fill="#101b2d" stroke="none"/><text x="67" y="657" font-size="22" fill="#a4b9cf" font-weight="700" >03</text><text x="117" y="644" font-size="21" fill="#e8f3ff" font-weight="600" >STT returns HTTP 402</text><text x="117" y="666" font-size="15" fill="#a4b9cf" font-weight="400" >transcriber_connection_error</text><text x="927" y="656" font-size="17" fill="#c280fa" font-weight="700" text-anchor="end">STT REJECTED</text><rect x="48" y="693" width="904" height="65" rx="6" fill="#101b2d" stroke="none"/><text x="67" y="734" font-size="22" fill="#a4b9cf" font-weight="700" >04</text><text x="117" y="721" font-size="21" fill="#e8f3ff" font-weight="600" >No inbound media</text><text x="117" y="743" font-size="15" fill="#a4b9cf" font-weight="400" >inactivity_timeout</text><text x="927" y="733" font-size="17" fill="#c280fa" font-weight="700" text-anchor="end">AUDIO FLOW</text><rect x="48" y="770" width="904" height="65" rx="6" fill="url(#active)" stroke="none"/><text x="67" y="811" font-size="22" fill="#e8f3ff" font-weight="700" >05</text><text x="117" y="798" font-size="21" fill="#e8f3ff" font-weight="600" >Corrected configuration</text><text x="117" y="820" font-size="15" fill="#e8f3ff" font-weight="4