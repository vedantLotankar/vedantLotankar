<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">08-experiments</title><desc id="desc">More solo experiments: supervised learning, reinforcement learning, sign-language translation and inventory management. Contact Vedant through a profile issue.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6d8432" stroke-width="1.6"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d3d9cf"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif} .flow{stroke-dasharray:9 9;animation:travel 2s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-36}}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes scan{50%{opacity:.15}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="1000" height="760" rx="0" fill="#f5f5ef" stroke="none"/><rect x="20" y="20" width="960" height="720" rx="0" fill="url(#grid)" stroke="none"/><text x="48" y="65" font-size="18" fill="#526b14" font-weight="700" letter-spacing="2">09</text><text x="102" y="65" font-size="18" fill="#596762" font-weight="400" letter-spacing="2">SOLO EXPERIMENTS</text><text x="48" y="133" font-size="48" fill="#1d2927" font-weight="750" letter-spacing="-2">Still opening things up.</text><text x="50" y="206" font-size="20" fill="#d4f654" font-weight="700" >01</text><text x="101" y="205" font-size="23" fill="#1d2927" font-weight="650" >SUPERVISED LEARNING</text><text x="101" y="231" font-size="18" fill="#596762" font-weight="400" >Regression / classification</text><path d="M50 245L950 245" fill="none" stroke="#d