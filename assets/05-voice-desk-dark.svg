<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1053" viewBox="0 0 1000 1053" role="img" aria-labelledby="title desc"><title id="title">05-voice-desk</title><desc id="desc">Wholesale Voice Desk, pair-built with Rishi. Lead intake branches on duplicates, do-not-call, consent and calling hours, then routes call results into CRM and booking.</desc><defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#070b15"/><stop offset="1" stop-color="#0d1024"/></linearGradient><linearGradient id="active"><stop stop-color="#12394d"/><stop offset="1" stop-color="#28234a"/></linearGradient><radialGradient id="aura"><stop stop-color="#204165" stop-opacity=".45"/><stop offset="1" stop-color="#090d19" stop-opacity="0"/></radialGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#42d5e5" stroke-width="1.6"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#25405a" stroke-width=".65"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}text[letter-spacing]{font-family:Consolas,monospace}.flow{stroke-dasharray:10 12}.pulse{filter:url(#glow)}</style><rect width="1000" height="1053" fill="url(#back)"/><rect width="1000" height="1053" fill="url(#grid)" opacity=".4"/><ellipse cx="780" cy="200" rx="400" ry="350" fill="url(#aura)"/><g opacity=".38"><path d="M164 783L-1180 1053" fill="none" stroke="#25405a" stroke-width="1" /><path d="M212 783L-940 1053" fill="none" stroke="#25405a" stroke-width="1" /><path d="M260 783L-700 1053" fill="none" stroke="#25405a" stroke-width="1" /><path d="M308 783L-460 1053" fill="none" stroke="#25405a" stroke-width="1" /><path d="M356 783L-220 1